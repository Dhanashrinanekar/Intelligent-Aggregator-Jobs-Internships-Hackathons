<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - JobMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-briefcase me-2"></i>JobMatch</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recommendations">Recommendations</a></li>
                    <li class="nav-item"><a class="nav-link" href="/jobs">Browse Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-2" id="pageTitle">
                            <i class="fas fa-file-upload text-primary"></i> Upload Your Resume
                        </h2>
                        <p class="text-center text-muted mb-4" id="pageSubtitle">Upload your resume to get personalized job recommendations</p>

                        <div id="alert-container"></div>

                        <!-- Shown only when resume already exists -->
                        <div id="existingResumeContainer" class="mb-4"></div>

                        <form id="uploadForm">
                            <div class="mb-4">
                                <label for="resumeFile" class="form-label" id="fileLabel">Select Resume (PDF or DOCX)</label>
                                <input class="form-control form-control-lg" type="file" id="resumeFile" accept=".pdf,.docx" required>
                                <small class="text-muted">Maximum file size: 5MB</small>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="uploadBtn">
                                    <i class="fas fa-cloud-upload-alt me-2"></i><span id="uploadBtnText">Upload & Process Resume</span>
                                </button>
                            </div>
                        </form>

                        <div id="processingInfo" class="mt-4" style="display:none;">
                            <div class="alert alert-info">
                                <h6><i class="fas fa-cog fa-spin me-2"></i>Processing your resume...</h6>
                                <div class="progress mt-2">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div>
                                </div>
                                <small class="mt-2 d-block">Extracting skills and matching with jobs...</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/api.js"></script>
    <script src="static/js/main.js"></script>
    <script>
        checkAuth();

        const form = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadBtnText = document.getElementById('uploadBtnText');
        const processingInfo = document.getElementById('processingInfo');
        const alertContainer = document.getElementById('alert-container');
        const existingResumeContainer = document.getElementById('existingResumeContainer');

        // Determine mode: upload vs update
        let isUpdate = false;

        async function loadExistingResume() {
            try {
                const user = await apiRequest('/api/users/me');
                if (user.resume_file) {
                    isUpdate = true;
                    const filename = user.resume_file.split('/').pop().split('\\').pop();
                    // Update page copy to reflect "update" mode
                    document.getElementById('pageTitle').innerHTML = '<i class="fas fa-sync-alt text-primary"></i> Update Your Resume';
                    document.getElementById('pageSubtitle').textContent = 'Replace your current resume with a new one';
                    uploadBtnText.textContent = 'Update & Process Resume';
                    document.getElementById('fileLabel').textContent = 'Select New Resume (PDF or DOCX)';

                    existingResumeContainer.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            <strong>Current resume:</strong> ${escapeHtml(filename)}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading resume info:', error);
            }
        }

        loadExistingResume();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('resumeFile');
            const file = fileInput.files[0];
            if (!file) { showAlert('Please select a file', 'danger'); return; }
            if (file.size > 5 * 1024 * 1024) { showAlert('File size exceeds 5MB', 'danger'); return; }
            const fileExt = '.' + file.name.split('.').pop().toLowerCase();
            if (!['.pdf', '.docx'].includes(fileExt)) { showAlert('Only PDF and DOCX files are allowed', 'danger'); return; }

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Uploading...';
            processingInfo.style.display = 'block';

            try {
                const formData = new FormData();
                formData.append('file', file);
                const token = localStorage.getItem('token');
                const response = await fetch('/api/resume/upload-resume', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    processingInfo.style.display = 'none';
                    showAlert(`Resume ${isUpdate ? 'updated' : 'uploaded'} successfully! Redirecting...`, 'success');
                    setTimeout(() => { window.location.href = '/upload-success'; }, 1500);
                } else {
                    processingInfo.style.display = 'none';
                    showAlert(data.detail || data.message || 'Upload failed', 'danger');
                }
            } catch (error) {
                processingInfo.style.display = 'none';
                showAlert(`Network error: ${error.message}`, 'danger');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = `<i class="fas fa-cloud-upload-alt me-2"></i><span id="uploadBtnText">${isUpdate ? 'Update' : 'Upload'} & Process Resume</span>`;
            }
        });

        function showAlert(message, type) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML;
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);
    </script>
</body>
</html>
