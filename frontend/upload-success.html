<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Processed - JobMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-briefcase me-2"></i>JobMatch</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recommendations">Recommendations</a></li>
                    <li class="nav-item"><a class="nav-link" href="/jobs">Browse Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <div class="mb-4"><i class="fas fa-check-circle fa-5x text-success"></i></div>
            <h1 class="mb-2">Resume Processed Successfully! 🎉</h1>
            <p class="text-muted lead">Your resume has been analyzed and we found matching job opportunities</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-4"><i class="fas fa-star text-warning me-2"></i>Extracted Skills</h5>
                        <div id="skillsList">
                            <div class="spinner-border text-primary" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-4"><i class="fas fa-chart-bar text-info me-2"></i>Match Summary</h5>
                        <div id="matchSummary" class="text-center">
                            <div class="spinner-border text-primary" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-4"><i class="fas fa-fire text-danger me-2"></i>Top Matching Jobs</h5>
                        <div id="topJobsList">
                            <div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-12">
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <a href="/recommendations" class="btn btn-success btn-lg">
                        <i class="fas fa-star me-2"></i>View All Recommendations
                    </a>
                    <a href="/dashboard" class="btn btn-primary btn-lg">
                        <i class="fas fa-home me-2"></i>Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/api.js"></script>
    <script src="static/js/main.js"></script>
    <script>
        checkAuth();

        async function loadData() {
            try {
                const user = await apiRequest('/api/users/me');

                if (user.skills && user.skills.trim() !== '') {
                    const skillsArray = user.skills.split(',').map(s => s.trim());
                    document.getElementById('skillsList').innerHTML = skillsArray
                        .map(skill => `<span class="badge bg-primary me-2 mb-2" style="font-size:0.95rem;padding:0.5rem 0.8rem;"><i class="fas fa-check me-1"></i>${skill}</span>`)
                        .join('');
                } else {
                    document.getElementById('skillsList').innerHTML = '<p class="text-muted">No skills extracted</p>';
                }

                const response = await apiRequest('/api/recommendations?limit=10');
                const matches = Array.isArray(response) ? response : (response.recommendations || []);

                if (matches.length > 0) {
                    document.getElementById('matchSummary').innerHTML = `
                        <div class="text-center">
                            <div style="font-size:3rem;color:#28a745;font-weight:bold;">${matches.length}</div>
                            <p class="text-muted mt-2">Job Opportunities Found</p>
                            <a href="/recommendations" class="btn btn-success mt-2"><i class="fas fa-star me-1"></i>See All</a>
                        </div>
                    `;
                } else {
                    document.getElementById('matchSummary').innerHTML = '<p class="text-muted">No matches found yet</p>';
                }

                const jobsList = document.getElementById('topJobsList');
                if (matches.length === 0) {
                    jobsList.innerHTML = '<p class="text-center text-muted py-4">No matching jobs found yet. Try browsing all available jobs.</p>';
                } else {
                    jobsList.innerHTML = matches.map((match, idx) => `
                        <div class="border-bottom pb-4 mb-4">
                            <div class="row align-items-center">
                                <div class="col-md-8">
                                    <div class="d-flex align-items-start">
                                        <div class="badge bg-success me-3" style="font-size:1rem;padding:0.5rem 0.8rem;">${idx+1}</div>
                                        <div>
                                            <h6 class="mb-1"><strong>${match.role}</strong></h6>
                                            <p class="text-muted mb-1 small">${match.company_name}</p>
                                            <small>
                                                <span class="badge bg-info me-2">${match.opportunity_type}</span>
                                                <span class="badge bg-secondary">${match.job_portal_name}</span>
                                            </small>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4 text-md-end mt-2 mt-md-0">
                                    <div class="mb-2"><span class="badge bg-success" style="font-size:1rem;padding:0.5rem 0.8rem;">${(match.similarity_score*100).toFixed(1)}% Match</span></div>
                                    <a href="${match.application_link}" target="_blank" class="btn btn-sm btn-primary"><i class="fas fa-external-link-alt me-1"></i>View Job</a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('skillsList').innerHTML = '<p class="text-danger">Error loading skills</p>';
                document.getElementById('matchSummary').innerHTML = '<p class="text-danger">Error loading summary</p>';
                document.getElementById('topJobsList').innerHTML = '<p class="text-danger">Error loading jobs</p>';
            }
        }

        loadData();
        document.getElementById('logoutBtn').addEventListener('click', logout);
    </script>
</body>
</html>
