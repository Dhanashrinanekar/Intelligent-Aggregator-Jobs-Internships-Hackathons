<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs - JobMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-briefcase me-2"></i>JobMatch</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="mb-4">Browse Jobs</h1>

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="keyword" placeholder="Search keyword...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="jobType">
                            <option value="">All Types</option>
                            <option value="job">Job</option>
                            <option value="internship">Internship</option>
                            <option value="competition">Competition</option>
                            <option value="hackathon">Hackathon</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="portal">
                            <option value="">All Portals</option>
                            <option value="Indeed">Indeed</option>
                            <option value="Naukri">Naukri</option>
                            <option value="Jooble">Jooble</option>
                            <option value="Unstop">Unstop</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" id="searchBtn"><i class="fas fa-search me-2"></i>Search</button>
                    </div>
                </div>
                <div class="mt-2">
                    <button class="btn btn-sm btn-outline-secondary" id="clearBtn"><i class="fas fa-times me-1"></i>Clear Filters</button>
                </div>
            </div>
        </div>

        <div id="jobsContainer">
            <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-3">Loading jobs...</p></div>
        </div>

        <nav id="pagination" style="display:none;">
            <ul class="pagination justify-content-center"></ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/api.js"></script>
    <script>
        // Render nav based on auth state
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.getElementById('navLinks');
            if (isAuthenticated()) {
                navLinks.innerHTML = `
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recommendations">Recommendations</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                `;
                document.getElementById('logoutBtn').addEventListener('click', logout);
            } else {
                navLinks.innerHTML = `
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                `;
            }
        });

        let currentPage = 1;
        const limit = 20;
        loadJobs();

        document.getElementById('searchBtn').addEventListener('click', () => { currentPage=1; loadJobs(); });
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('keyword').value = '';
            document.getElementById('jobType').value = '';
            document.getElementById('portal').value = '';
            currentPage = 1; loadJobs();
        });
        document.getElementById('keyword').addEventListener('keypress', (e) => { if(e.key==='Enter'){currentPage=1;loadJobs();} });

        async function loadJobs() {
            const keyword = document.getElementById('keyword').value.trim();
            const jobType = document.getElementById('jobType').value;
            const portal = document.getElementById('portal').value;
            const params = new URLSearchParams({ page: currentPage, limit });
            if (keyword) params.append('keyword', keyword);
            if (jobType) params.append('opportunity_type', jobType);
            if (portal) params.append('portal', portal);
            try {
                const response = await fetch(`/api/jobs/search?${params}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                displayJobs(data.jobs);
                displayPagination(data.total_pages, data.page);
            } catch (error) {
                document.getElementById('jobsContainer').innerHTML = `<div class="alert alert-danger"><h5><i class="fas fa-exclamation-triangle me-2"></i>Error loading jobs</h5><p>${error.message}</p><button class="btn btn-sm btn-danger" onclick="loadJobs()">Try Again</button></div>`;
            }
        }

        function displayJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            if (!jobs || jobs.length === 0) {
                container.innerHTML = `<div class="alert alert-info text-center"><i class="fas fa-info-circle fa-3x mb-3 text-info"></i><h5>No jobs found</h5><p>Try adjusting your search criteria</p></div>`;
                return;
            }
            container.innerHTML = jobs.map(job => {
                return `
                <div class="card mb-3 shadow-sm job-card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-9">
                                <h5 class="card-title mb-2">${escapeHtml(job.role)}</h5>
                                <p class="text-muted mb-2"><i class="fas fa-building me-2"></i>${escapeHtml(job.company_name)}</p>
                                <div class="mb-2">
                                    ${isValid(job.opportunity_type) ? `<span class="badge bg-primary me-2">${escapeHtml(job.opportunity_type)}</span>` : ''}
                                    ${isValid(job.job_portal_name) ? `<span class="badge bg-info me-2">${escapeHtml(job.job_portal_name)}</span>` : ''}
                                    ${isValid(job.experience_required) ? `<span class="badge bg-secondary">${cleanText(job.experience_required)}</span>` : ''}
                                </div>
                                ${isValid(job.skills) ? `<p class="small text-muted mb-0"><strong>Skills:</strong> ${cleanText(job.skills)}</p>` : ''}
                            </div>
                            <div class="col-md-3 text-end d-flex flex-column justify-content-center">
                                <a href="${escapeHtml(job.application_link)}" target="_blank" class="btn btn-primary mb-2"><i class="fas fa-external-link-alt me-2"></i>Apply Now</a>
                                <small class="text-muted"><i class="fas fa-calendar-alt me-1"></i>${formatDate(job.created_at)}</small>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function displayPagination(totalPages, currentPageNum) {
            const pagination = document.getElementById('pagination');
            const paginationList = pagination.querySelector('.pagination');
            if (totalPages <= 1) { pagination.style.display='none'; return; }
            pagination.style.display = 'block';
            let html = `<li class="page-item ${currentPageNum===1?'disabled':''}"><a class="page-link" href="#" onclick="changePage(${currentPageNum-1});return false;">Previous</a></li>`;
            const maxP=5; let start=Math.max(1,currentPageNum-2); let end=Math.min(totalPages,start+maxP-1);
            if(end-start<maxP-1) start=Math.max(1,end-maxP+1);
            if(start>1){html+=`<li class="page-item"><a class="page-link" href="#" onclick="changePage(1);return false;">1</a></li>`;if(start>2)html+=`<li class="page-item disabled"><a class="page-link">...</a></li>`;}
            for(let i=start;i<=end;i++) html+=`<li class="page-item ${i===currentPageNum?'active':''}"><a class="page-link" href="#" onclick="changePage(${i});return false;">${i}</a></li>`;
            if(end<totalPages){if(end<totalPages-1)html+=`<li class="page-item disabled"><a class="page-link">...</a></li>`;html+=`<li class="page-item"><a class="page-link" href="#" onclick="changePage(${totalPages});return false;">${totalPages}</a></li>`;}
            html+=`<li class="page-item ${currentPageNum===totalPages?'disabled':''}"><a class="page-link" href="#" onclick="changePage(${currentPageNum+1});return false;">Next</a></li>`;
            paginationList.innerHTML = html;
        }

        function changePage(page) { currentPage=page; loadJobs(); window.scrollTo({top:0,behavior:'smooth'}); }

        function formatDate(dateString) {
            if(!dateString) return 'Recently';
            const date=new Date(dateString); const now=new Date(); const diffDays=Math.ceil(Math.abs(now-date)/(1000*60*60*24));
            if(diffDays===0) return 'Today'; if(diffDays===1) return 'Yesterday';
            if(diffDays<7) return `${diffDays} days ago`; if(diffDays<30) return `${Math.floor(diffDays/7)} weeks ago`;
            return date.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
        }

        function escapeHtml(text) {
            if(!text) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = text;
            const stripped = (tmp.textContent || tmp.innerText || '').replace(/[\xa0]/g, ' ').trim();
            const div = document.createElement('div');
            div.textContent = stripped;
            return div.innerHTML;
        }

        // Strip HTML tags, entities, # noise from scraped job data
        function cleanText(val) {
            if (!val) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = val
                .replace(/<[^>]*>/g, ' ')
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>');
            let text = (tmp.textContent || tmp.innerText || val);
            return text
                .replace(/#/g, '')
                .replace(/\.\.\.+/g, '')
                .replace(/\s*,\s*/g, ', ')
                .replace(/,\s*,/g, ',')
                .replace(/^[\s,]+|[\s,]+$/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function isValid(val) {
            if (!val) return false;
            const tmp = document.createElement('div');
            tmp.innerHTML = val;
            const cleaned = (tmp.textContent || tmp.innerText || '').replace(/&nbsp;/gi,' ').replace(/#/g,'').trim().toLowerCase();
            return cleaned !== '' && cleaned !== 'n/a' && cleaned !== 'null' && cleaned !== 'not specified' && cleaned !== 'na' && cleaned !== 'none';
        }
    </script>
</body>
</html>
